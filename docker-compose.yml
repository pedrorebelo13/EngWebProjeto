services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017/projetoEW
    command: npm run seed
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "16000:16000"
    environment:
      PORT: 16000
      MONGO_URL: mongodb://mongo:27017/projetoEW
      JWT_SECRET: 2026-04-13
      JWT_EXPIRES_IN: 1h
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  mongo_data: